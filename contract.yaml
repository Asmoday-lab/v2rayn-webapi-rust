# Contract inventory — tracked from upstream, never frozen locally.
#
# Source of truth: oracle.lock commits. This file is a *map*, not a spec:
# it records which upstream file defines each contract surface. The differential
# test derives actual request/response pairs from the pinned C# source at CI time.
#
# Regenerate/inspect with: python3 scripts/contract-inventory.py

version: 1
oracle: oracle.lock

# Counts measured 2026-11-14 from v2rayN.WebAPI (93 REST + 1 SSE).
counts:
  rest_endpoints: 93
  sse_endpoints: 1
  sse_event_types: 15
  stable_error_codes: 100
  capabilities: 12

capabilities:
  - auth.sessions
  - events.sse
  - editor.options
  - profiles
  - subscriptions
  - routing
  - dns
  - settings
  - backup.restore
  - core.runtime
  - core.updates
  - WebAPI.self-update

# Endpoint groups by URL prefix. Full path lists live in the pinned C# source
# (Api/WebApiEndpoints.cs etc.), counted here for drift detection.
endpoint_groups:
  settings: 31
  profiles: 15
  subscriptions: 8
  core-updates: 6
  core: 6
  backup: 5
  profile-groups: 4
  web-updates: 3
  logs: 3
  auth: 3
  speedtests: 2
  setup: 2
  operations: 2
  status: 1
  statistics: 1
  latency: 1
  health: 1
  events: 1
  editor-options: 1

# Contract surfaces with known non-obvious semantics — these are the ones most
# likely to break a Rust reimplementation and must be covered by differential tests.
semantic_hotspots:
  - id: health-headers
    source: Api/WebHealthEndpoint.cs
    status: covered-by-differential
    note: 'Body {"status":"ok"}; 5 diagnostic headers only for loopback peer + local Host + same-origin + no forwarded headers. Ported from WebSetupAccessPolicy + WebCorsPolicy.IsSameOriginRequest; verified by differential job (plain + forwarded-header cases). Foreign-Origin 403 case deferred until WebOriginGuardMiddleware is ported.'
  - id: json-enum-casing
    source: Program.cs:245
    note: JsonStringEnumConverter(JsonNamingPolicy.CamelCase); JsonSerializerDefaults.Web everywhere.
  - id: case-insensitive-duplicate
    source: V2rayRuntime.Backup.cs:819
    note: PropertyNameCaseInsensitive=true on backup restore; C# keeps last duplicate. Nova commits fbe6134/625c65d exist solely to match this.
  - id: session
    source: Security/WebAuthService.cs
    status: covered-by-differential
    note: '32B base64url session; SHA-256 digest storage; sliding 7d / absolute 30d; login rate limit 5/min; PBKDF2 env-key verification. Covered by login wrong/empty/valid + unauthenticated cases.'
  - id: sse-ticket
    source: Api/WebApiEndpoints.cs
    status: covered-by-differential
    note: 'one-shot 45s ticket for /api/events via query param. Middleware consumes ticket; covered by no-ticket/bogus-ticket 401 + authenticated minting cases.'
  - id: setup-loopback
    source: Api/WebSetupEndpoints.cs
    status: ported
    note: loopback + same-origin + no forwarded headers; 10/min rate limit.
  - id: cors-origin-guard
    source: Security/WebCorsPolicy.cs
    status: covered-by-differential
    note: 'exact origin allowlist + browser Sec-Fetch-Site same-origin; middleware order (headers→body-limit→routing→origin→cors→rate-limit→session); 64KiB body cap. Foreign-origin 403 case covered.'
  - id: capabilities
    source: Contracts/WebApiCapabilities.cs
    status: covered-by-differential
    note: '12 items incl. core.updates + WebAPI.self-update; returned verbatim in /api/status and compared by differential (runtime diagnostic fields normalized).'
  - id: random-entity-ids
    source: ServiceLib (Utils.GetId)
    status: normalized-in-differential
    note: 'C# emits a fresh 19-digit long per entity on every start (dns/routing profiles, core templates). Normalize id/Id fields and embedded JSON ruleSet before compare.'
  - id: static-dto-shapes
    source: Api/WebApiEndpoints.cs (golden sample)
    status: covered-by-differential
    note: '16 GET endpoints served from resources/*.json captured from the pinned oracle; re-captured each CI run as oracle-golden-sample artifact for drift detection.'
  - id: camelcase-request-binding
    source: Program.cs:244-245 (JsonSerializerDefaults.Web)
    status: covered-by-differential
    note: 'Request DTOs must use camelCase aliases in Rust; a missing serde rename silently maps subscriptionId/useProxy to None and echoes "". Regression test added in mutations.rs.'
  - id: deterministic-write-ops
    source: Api/WebApiEndpoints.cs + Services/V2rayRuntime.*.cs
    status: covered-by-differential
    note: '11 headless-safe no-op/error writes (logs/statistics/speedtests/latency/core-stop/profiles dedup+invalid/current group/routing import/subscription update/profile select) plus generate/all empty-group error. Captured from oracle __mutations__ golden sample.'
  - id: validation-error-paths
    source: Services/V2rayRuntime.Profiles.cs / Settings.cs / V2rayRuntime.cs
    status: covered-by-differential
    note: '13 input-validation failures that return before Core/IO side effects: profile import/sort/delete/copy, subscription create/delete, app/inbound/speedtest/routing settings, routing-rules import/import-url, generate/regions. Codes and messageKeys transcribed from the pinned C# source.'
  - id: unsafe-update-ops-excluded
    source: Services/V2rayRuntime.CoreUpdate.cs:203-260
    status: intentionally-uncovered
    note: 'POST /api/core-updates/batch is NOT differential-testable: CoreUpdateBatchInput.Apply is bool and even apply=false spawns RunSelectedCoreUpdateBatchAsync (network downloads). Excluded from corpus, oracle dump and Rust routes; do not re-add without a hermetic core-update fixture.'
