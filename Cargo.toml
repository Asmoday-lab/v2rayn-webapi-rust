[package]
name = "v2rayn-webapi-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Headless WebAPI for Termux, contract-compatible with v2rayN.WebAPI"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pure-Rust crypto for the C#-compatible management-key verifier (PBKDF2-HMAC-SHA256)
# and session token digests. No C toolchain, safe for static musl cross-builds.
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
# Pure-Rust CSPRNG; works on Linux (getrandom syscall) and Windows (dev tests).
# No C toolchain — safe for static musl cross-builds.
getrandom = "0.3"
# SSE heartbeat stream (pure Rust, no C toolchain).
tokio-stream = { version = "0.1", features = ["time"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[workspace]
