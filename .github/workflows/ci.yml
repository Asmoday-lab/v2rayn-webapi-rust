name: ci

# Only the final aarch64-musl release artifact is CI-only by policy.
# Local cargo check/fmt/clippy/debug build/test are allowed (see README).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily 03:17 UTC — contract drift check, opens a PR rather than mutating the pin.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Job 1: x64 fast feedback — fmt / clippy / unit tests / dependency guard.
  # This is the only job that runs on every push and PR.
  verify:
    name: x64 verify (fmt, clippy, test, deps)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test (x64 debug)
        run: cargo test --all-targets
      - name: dependency graph guard
        run: bash scripts/check-deps.sh
      - name: oracle.lock schema check
        run: python3 -c 'import json;d=json.load(open("oracle.lock"));assert d["schema"]==1;assert len(d["oracle"]["commit"])==40;assert len(d["client"]["commit"])==40;print("oracle.lock OK")'

  # Job 1b: differential test against the pinned C# oracle. Runs on x64 so the
  # oracle (net10.0, no Android target) can execute. This is the authority for
  # "contract-compatible" — a green verify job alone proves nothing.
  differential:
    name: x64 differential vs pinned C# oracle
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - name: Resolve pinned oracle SHA
        id: pin
        run: |
          set -euo pipefail
          sha="$(python3 -c 'import json;print(json.load(open("oracle.lock"))["oracle"]["commit"])')"
          repo="$(python3 -c 'import json;print(json.load(open("oracle.lock"))["oracle"]["repository"])')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "oracle commit $sha @ $repo"
      - name: Checkout pinned C# oracle source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.sha }}
          path: oracle-src
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Differential health suite
        run: bash scripts/differential.sh "$PWD/oracle-src"
      - name: Upload oracle golden sample
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-golden-sample
          path: oracle-dump.json
          if-no-files-found: warn
      - name: Upload differential logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: differential-logs
          path: |
            /tmp/tmp.*/oracle.log
            /tmp/tmp.*/rust.log
          if-no-files-found: ignore

  # Job 2: the only CI-only compilation — the shipping aarch64-musl static
  # binary. Produces a release artifact; local builds of this target are banned
  # by policy, not by CI (there is no enforcement that a human did not build it).
  build-aarch64-musl:
    name: build aarch64-unknown-linux-musl (release, static)
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install zig 0.13.0 (pinned, sha256 verified)
        # goto-bus-stop/setup-zig is deprecated (final v2.2.1), still runs on
        # Node 20, and its built-in tool cache hits GitHub's retired cache
        # service (400 / "service unavailable"). Install from the official
        # tarball with a pinned sha256 from ziglang.org/download/index.json.
        env:
          ZIG_VERSION: 0.13.0
          ZIG_SHA256: d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
        run: |
          set -euo pipefail
          tarball="zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${tarball}" -o "$tarball"
          echo "${ZIG_SHA256}  ${tarball}" | sha256sum --check --strict
          mkdir -p "$HOME/.local"
          tar -xf "$tarball" -C "$HOME/.local"
          echo "$HOME/.local/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Verify zig
        run: zig version
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Build release (static musl)
        # zig 0.13 bundles musl 1.2.4, whose dlstart.c uses a K&R declaration
        # that clang flags as -Wdeprecated-non-prototype under C23. rustc
        # forwards linker stderr via the `linker_messages` lint; suppress only
        # that lint (not all warnings) since it is upstream and harmless.
        env:
          RUSTFLAGS: -A linker_messages
        run: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl
      - name: Verify statically linked, no INTERP
        run: |
          set -euo pipefail
          bin="target/aarch64-unknown-linux-musl/release/v2rayn-webapi-rs"
          file "$bin"
          file "$bin" | grep -q 'statically linked'
          if readelf -l "$bin" | grep -q INTERP; then
            echo "ERROR: binary has an INTERP segment (dynamic loader)" >&2
            readelf -l "$bin" >&2
            exit 1
          fi
          echo "static ELF verified: no INTERP, statically linked"
      - uses: actions/upload-artifact@v7
        with:
          name: v2rayn-webapi-rs-aarch64-musl
          path: target/aarch64-unknown-linux-musl/release/v2rayn-webapi-rs
          if-no-files-found: error

  # Job 3: contract drift watch. Does NOT auto-advance oracle.lock (that would
  # silently change the differential baseline). It opens a PR instead, so the
  # lock mutation is reviewable. Runs on a schedule and on demand.
  contract-watch:
    name: watch upstream contract drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Compare oracle.lock to upstream HEAD
        id: drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/2dust/v2rayN/commits/master
          upstream=$(curl -fsSL "$api" | python3 -c 'import json,sys;print(json.load(sys.stdin)["sha"])')
          pinned=$(python3 -c 'import json;print(json.load(open("oracle.lock"))["oracle"]["commit"])')
          echo "upstream=$upstream"
          echo "pinned=$pinned"
          if [ "$upstream" != "$pinned" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning::oracle.lock is pinned to $pinned; upstream master is $upstream"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open lock-update PR on drift
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.CONTRACT_WATCH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 scripts/bump-oracle-lock.py
          git config user.name 'contract-watch[bot]'
          git config user.email 'contract-watch@users.noreply.github.com'
          branch="contract-watch/$(date +%Y%m%d)"
          git checkout -b "$branch"
          git add oracle.lock
          git commit -m "chore: advance oracle.lock to upstream HEAD"
          git push origin "$branch"
          gh pr create \
            --title "chore: advance differential oracle baseline" \
            --body "Auto-generated by contract-watch. CI will run the full differential suite against the new pin; review before merging." \
            --head "$branch" \
            --base "${{ github.event.repository.default_branch }}"
